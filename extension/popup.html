<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHopper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">GitHopper</h1>
            <p class="subtitle">Code Health Scanner</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="section hidden">
            <div class="spinner"></div>
            <p>Analyzing repository...</p>
        </div>

        <!-- Input Section -->
        <div id="inputSection" class="section">
            <div class="input-group">
                <label for="repoUrl" class="label">GitHub Repository</label>
                <div class="input-wrapper">
                    <span class="prefix">github.com/</span>
                    <input 
                        type="text" 
                        id="repoUrl" 
                        placeholder="username/repository" 
                        class="input"
                        autocomplete="off"
                    >
                </div>
                <button id="scanBtn" class="button button-primary">Scan Repository</button>
            </div>
        </div>

        <!-- Error Section -->
        <div id="errorSection" class="section hidden">
            <div class="error-message" id="errorText"></div>
            <button id="retryBtn" class="button button-secondary">Try Again</button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="section hidden">
            <!-- Health Score Card -->
            <div class="card health-card">
                <h2>Health Score</h2>
                <div class="score-display">
                    <div class="score-number" id="healthScore">--</div>
                    <div class="score-label">out of 100</div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="card">
                <h3>Statistics</h3>
                <div class="stats-grid" id="statsGrid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Critical Issues -->
            <div id="criticalSection" class="card hidden">
                <h3 class="critical-title">🚨 Critical Issues</h3>
                <div id="criticalList" class="issues-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Quick Wins -->
            <div id="quickWinsSection" class="card hidden">
                <h3 class="success-title">✨ Quick Wins</h3>
                <div id="quickWinsList" class="issues-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Medium Issues -->
            <div id="mediumSection" class="card hidden">
                <h3 class="warning-title">⚠️ Medium Issues</h3>
                <div id="mediumList" class="issues-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Full Report Button -->
            <button id="fullReportBtn" class="button button-secondary full-width">
                View Full Report →
            </button>

            <!-- New Scan Button -->
            <button id="newScanBtn" class="button button-tertiary full-width">
                New Scan
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
